    <script>
      try {
        localStorage.setItem("layout", "tv");
        localStorage.setItem("enableGamepad", "true");
      } catch (e) {
        console.warn("Unable to persist TV controller settings", e);
      }

      (function () {
        function isLayoutSelector(element) {
          return (
            element &&
            (" " + element.className + " ").indexOf(" selectLayout ") !== -1
          );
        }

        function lockLayoutSelector(scope) {
          var selectors = [];
          var descendants;
          var index;

          if (isLayoutSelector(scope)) selectors.push(scope);
          if (scope.querySelectorAll) {
            descendants = scope.querySelectorAll(".selectLayout");
            for (index = 0; index < descendants.length; index++) {
              selectors.push(descendants[index]);
            }
          }

          for (index = 0; index < selectors.length; index++) {
            var select = selectors[index];
            var tvOption;
            var optionIndex;

            if (select.getAttribute("data-tv-layout-locked")) continue;
            for (optionIndex = 0; optionIndex < select.options.length; optionIndex++) {
              if (select.options[optionIndex].value === "tv") {
                tvOption = select.options[optionIndex];
                break;
              }
            }
            if (!tvOption) {
              tvOption = document.createElement("option");
              tvOption.value = "tv";
              tvOption.text = "TV";
            }

            while (select.firstChild) select.removeChild(select.firstChild);
            select.appendChild(tvOption);
            select.value = "tv";
            select.disabled = true;
            select.setAttribute("data-tv-layout-locked", "true");
          }
        }

        function addChangeServerButton(scope) {
          var logoutButton;
          var button;

          if (isLayoutSelector(scope)) return;
          if (
            scope &&
            (" " + scope.className + " ").indexOf(" btnLogout ") !== -1
          ) {
            logoutButton = scope;
          } else if (scope && scope.querySelector) {
            logoutButton = scope.querySelector(".btnLogout.listItem-border");
          }

          if (
            !logoutButton ||
            (" " + logoutButton.className + " ").indexOf(
              " listItem-border "
            ) === -1 ||
            logoutButton.parentNode.querySelector("[data-tv-change-server]")
          ) {
            return;
          }

          button = document.createElement("a");
          button.className =
            "emby-button selectServer listItem-border show-focus";
          button.href = "#/selectserver";
          button.setAttribute("data-tv-change-server", "true");
          button.style.display = "block";
          button.style.margin = "0";
          button.style.padding = "0";
          button.innerHTML =
            '<div class="listItem">' +
            '<span class="material-icons listItemIcon listItemIcon-transparent storage" aria-hidden="true"></span>' +
            '<div class="listItemBody"><div class="listItemBodyText">Change Server</div></div>' +
            "</div>";
          logoutButton.parentNode.insertBefore(button, logoutButton.nextSibling);
        }

        function addUnavailableServerButton() {
          var headings = document.querySelectorAll("h1, h2, h3, [role='heading']");
          var heading;
          var container;
          var button;
          var index;

          for (index = 0; index < headings.length; index++) {
            if (headings[index].textContent.replace(/\s+/g, " ").trim() === "Server Unavailable") {
              heading = headings[index];
              break;
            }
          }
          if (!heading) return;

          container = heading.parentNode;
          if (!container || container.querySelector("[data-tv-unavailable-change-server]")) return;

          button = document.createElement("a");
          button.className = "emby-button raised button-submit show-focus";
          button.href = "#/selectserver";
          button.textContent = "Change Server";
          button.setAttribute("data-tv-unavailable-change-server", "true");
          button.style.display = "inline-flex";
          button.style.marginTop = "2em";
          button.style.minWidth = "12em";
          button.style.justifyContent = "center";
          container.appendChild(button);
        }

        // The PS5 web-app runtime reports DualSense input as keyboard events
        // (D-pad = arrows, Cross = Enter, Circle = Escape). Jellyfin's web
        // Gamepad API is not available there, so provide TV-style focus
        // navigation from those events directly.
        function installPs5ControllerNavigation() {
          var selector =
            "a[href], button, input, select, textarea, [tabindex]:not([tabindex='-1']), .focusable";

          function visible(element) {
            var style;
            if (!element || element.disabled || element.getAttribute("aria-hidden") === "true") return false;
            style = window.getComputedStyle(element);
            return element.offsetParent !== null && style.visibility !== "hidden" && style.display !== "none";
          }

          function controls() {
            var all = document.querySelectorAll(selector);
            var out = [];
            var index;
            for (index = 0; index < all.length; index++) {
              // Keep the outer actionable element, not its nested icon/text.
              var parent = all[index].parentElement;
              var nested = false;
              while (parent) {
                if (parent.matches && parent.matches("a[href], button, input, select, textarea, [tabindex]:not([tabindex='-1'])")) {
                  nested = true;
                  break;
                }
                parent = parent.parentElement;
              }
              if (visible(all[index]) && !nested) {
                out.push(all[index]);
              }
            }
            return out;
          }

          function focus(element) {
            if (!element) return null;
            if (!element.hasAttribute("tabindex") && !/^(A|BUTTON|INPUT|SELECT|TEXTAREA)$/.test(element.tagName)) {
              element.setAttribute("tabindex", "0");
            }
            element.focus();
            try {
              element.scrollIntoView({ block: "nearest", inline: "nearest" });
            } catch (error) {
              element.scrollIntoView(false);
            }
            return element;
          }

          function current(items) {
            var active = document.activeElement;
            if (items.indexOf(active) >= 0) return active;
            return null;
          }

          function move(direction) {
            var items = controls();
            var from = current(items);
            var origin;
            var best;
            var bestScore = Infinity;
            var index;
            if (!items.length) return;
            if (!from) {
              focus(items[0]);
              return;
            }
            origin = from.getBoundingClientRect();
            for (index = 0; index < items.length; index++) {
              var candidate = items[index];
              var rect;
              var dx;
              var dy;
              var along;
              var across;
              var score;
              if (candidate === from) continue;
              rect = candidate.getBoundingClientRect();
              dx = rect.left + rect.width / 2 - (origin.left + origin.width / 2);
              dy = rect.top + rect.height / 2 - (origin.top + origin.height / 2);
              if (direction === "left") { if (dx >= -4) continue; along = -dx; across = Math.abs(dy); }
              if (direction === "right") { if (dx <= 4) continue; along = dx; across = Math.abs(dy); }
              if (direction === "up") { if (dy >= -4) continue; along = -dy; across = Math.abs(dx); }
              if (direction === "down") { if (dy <= 4) continue; along = dy; across = Math.abs(dx); }
              score = along + across * 3;
              if (score < bestScore) { best = candidate; bestScore = score; }
            }
            if (best) focus(best);
          }

          document.addEventListener("keydown", function (event) {
            var key = event.key || "";
            var code = event.keyCode || event.which;
            var active = document.activeElement;
            var isTextField = active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
            var directions = { 37: "left", 38: "up", 39: "right", 40: "down", ArrowLeft: "left", ArrowUp: "up", ArrowRight: "right", ArrowDown: "down" };
            var direction = directions[key] || directions[code];

            if (direction) {
              event.preventDefault();
              event.stopPropagation();
              move(direction);
              return;
            }
            if ((key === "Enter" || code === 13) && !isTextField) {
              event.preventDefault();
              event.stopPropagation();
              active = document.activeElement;
              if (active && visible(active)) active.click();
              else focus(controls()[0]);
              return;
            }
            if ((key === "Escape" || key === "Esc" || code === 27) && !isTextField) {
              event.preventDefault();
              event.stopPropagation();
              window.history.back();
            }
          }, true);
        }

        document.addEventListener(
          "change",
          function (event) {
            if (isLayoutSelector(event.target)) event.target.value = "tv";
          },
          true
        );

        lockLayoutSelector(document);
        addChangeServerButton(document);
        addUnavailableServerButton();
        installPs5ControllerNavigation();
        if (window.MutationObserver) {
          new MutationObserver(function (records) {
            for (var recordIndex = 0; recordIndex < records.length; recordIndex++) {
              var nodes = records[recordIndex].addedNodes;
              for (var nodeIndex = 0; nodeIndex < nodes.length; nodeIndex++) {
                lockLayoutSelector(nodes[nodeIndex]);
                addChangeServerButton(nodes[nodeIndex]);
              }
            }
            addUnavailableServerButton();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
