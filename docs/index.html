    <script>
      try {
        localStorage.setItem("layout", "tv");
        localStorage.setItem("enableGamepad", "true");
      } catch (e) {
        console.warn("Unable to persist TV controller settings", e);
      }

      (function () {
        function isLayoutSelector(element) {
          return (
            element &&
            (" " + element.className + " ").indexOf(" selectLayout ") !== -1
          );
        }

        function lockLayoutSelector(scope) {
          var selectors = [];
          var descendants;
          var index;

          if (isLayoutSelector(scope)) selectors.push(scope);
          if (scope.querySelectorAll) {
            descendants = scope.querySelectorAll(".selectLayout");
            for (index = 0; index < descendants.length; index++) {
              selectors.push(descendants[index]);
            }
          }

          for (index = 0; index < selectors.length; index++) {
            var select = selectors[index];
            var tvOption;
            var optionIndex;

            if (select.getAttribute("data-tv-layout-locked")) continue;
            for (optionIndex = 0; optionIndex < select.options.length; optionIndex++) {
              if (select.options[optionIndex].value === "tv") {
                tvOption = select.options[optionIndex];
                break;
              }
            }
            if (!tvOption) {
              tvOption = document.createElement("option");
              tvOption.value = "tv";
              tvOption.text = "TV";
            }

            while (select.firstChild) select.removeChild(select.firstChild);
            select.appendChild(tvOption);
            select.value = "tv";
            select.disabled = true;
            select.setAttribute("data-tv-layout-locked", "true");
          }
        }

        function addChangeServerButton(scope) {
          var logoutButton;
          var button;

          if (isLayoutSelector(scope)) return;
          if (
            scope &&
            (" " + scope.className + " ").indexOf(" btnLogout ") !== -1
          ) {
            logoutButton = scope;
          } else if (scope && scope.querySelector) {
            logoutButton = scope.querySelector(".btnLogout.listItem-border");
          }

          if (
            !logoutButton ||
            (" " + logoutButton.className + " ").indexOf(
              " listItem-border "
            ) === -1 ||
            logoutButton.parentNode.querySelector("[data-tv-change-server]")
          ) {
            return;
          }

          button = document.createElement("a");
          button.className =
            "emby-button selectServer listItem-border show-focus";
          button.href = "#/selectserver";
          button.setAttribute("data-tv-change-server", "true");
          button.style.display = "block";
          button.style.margin = "0";
          button.style.padding = "0";
          button.innerHTML =
            '<div class="listItem">' +
            '<span class="material-icons listItemIcon listItemIcon-transparent storage" aria-hidden="true"></span>' +
            '<div class="listItemBody"><div class="listItemBodyText">Change Server</div></div>' +
            "</div>";
          logoutButton.parentNode.insertBefore(button, logoutButton.nextSibling);
        }

        function addUnavailableServerButton() {
          var headings = document.querySelectorAll("h1, h2, h3, [role='heading']");
          var heading;
          var container;
          var button;
          var index;

          for (index = 0; index < headings.length; index++) {
            if (headings[index].textContent.replace(/\s+/g, " ").trim() === "Server Unavailable") {
              heading = headings[index];
              break;
            }
          }
          if (!heading) return;

          container = heading.parentNode;
          if (!container || container.querySelector("[data-tv-unavailable-change-server]")) return;

          button = document.createElement("a");
          button.className = "emby-button raised button-submit show-focus";
          button.href = "#/selectserver";
          button.textContent = "Change Server";
          button.setAttribute("data-tv-unavailable-change-server", "true");
          button.style.display = "inline-flex";
          button.style.marginTop = "2em";
          button.style.minWidth = "12em";
          button.style.justifyContent = "center";
          container.appendChild(button);
        }

        document.addEventListener(
          "change",
          function (event) {
            if (isLayoutSelector(event.target)) event.target.value = "tv";
          },
          true
        );

        lockLayoutSelector(document);
        addChangeServerButton(document);
        addUnavailableServerButton();
        if (window.MutationObserver) {
          new MutationObserver(function (records) {
            for (var recordIndex = 0; recordIndex < records.length; recordIndex++) {
              var nodes = records[recordIndex].addedNodes;
              for (var nodeIndex = 0; nodeIndex < nodes.length; nodeIndex++) {
                lockLayoutSelector(nodes[nodeIndex]);
                addChangeServerButton(nodes[nodeIndex]);
              }
            }
            addUnavailableServerButton();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
